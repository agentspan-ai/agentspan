site_name: Agentspan Docs
site_description: Agentspan — long-running, dynamic, and event-driven AI agents built on Conductor.
site_url: https://agentspan.ai/docs/
repo_url: https://github.com/agentspan-ai/agentspan
repo_name: agentspan-ai/agentspan
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

extra_css:
  - css/custom.css

theme:
  name: material
  font:
    text: false
    code: false
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Design docs live in the top-level design/ folder, not here. docs/ holds only
# user-facing docs. The per-SDK docs (java-sdk/, python-sdk/, typescript-sdk/,
# csharp-sdk/) are symlinks into sdk/<lang>/docs and are linked from the nav.

