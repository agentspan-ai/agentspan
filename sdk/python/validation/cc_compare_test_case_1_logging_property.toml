# Test case 1: business-context lookup for AGENTSPAN_LOG_LEVEL.
# Two autonomous Claude Code CLI agents answer the same docs question.
# with_ocg uses the OCG /agent/query endpoint; no_ocg uses grep/find/git.
#
# Usage:
#   cd sdk/python
#   python -m validation.scripts.run_claude_code \
#       --config validation/cc_compare_test_case_1_logging_property.toml --judge

[defaults]
timeout = 300
# Number of fresh, memory-isolated invocations per agent. Each iteration runs
# with `claude --bare --no-session-persistence` so no auto-memory / CLAUDE.md /
# session state leaks across runs. Per-iteration tokens, scores, and outputs
# are written separately to run_results.json.
iterations = 5

[judge]
# No baseline_run — both agents scored independently against the task prompt.
model = "gpt-4o-mini"
max_output_chars = 4000
max_tokens = 400
rate_limit = 0.5

[runs.with_ocg]
prompt_file = "validation/prompts/test_case_1_logging_property/with_ocg.md"
# OCG_API_KEY must be set in your shell environment before running
allowed_tools = ["Bash(curl:*)"]

[runs.no_ocg]
prompt_file = "validation/prompts/test_case_1_logging_property/no_ocg.md"
# Traditional grep-baseline: file inspection + git history, no OCG.
allowed_tools = [
    "Read",
    "Glob",
    "Grep",
    "Bash(grep:*)",
    "Bash(rg:*)",
    "Bash(find:*)",
    "Bash(cat:*)",
    "Bash(ls:*)",
    "Bash(git log:*)",
    "Bash(git show:*)",
    "Bash(git blame:*)",
    "Bash(git diff:*)",
]
