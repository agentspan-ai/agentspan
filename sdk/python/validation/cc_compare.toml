# Claude Code agent comparison: OCG-aware vs baseline.
#
# Two autonomous Claude Code CLI agents run the same docs task.
# One is told about OCG and how to traverse the knowledge graph.
# The other uses only grep/find/cat.
#
# Usage:
#   cd sdk/python
#   python -m validation.scripts.run_claude_code --config validation/cc_compare.toml
#   python -m validation.scripts.run_claude_code --config validation/cc_compare.toml --judge

[defaults]
timeout = 300

[judge]
# No baseline_run — both agents scored independently against the task prompt.
model = "gpt-4o-mini"
max_output_chars = 4000
max_tokens = 400
rate_limit = 0.5

[runs.with_ocg]
prompt_file = "validation/prompts/with_ocg.md"
# OCG_API_KEY must be set in your shell environment before running

[runs.no_ocg]
prompt_file = "validation/prompts/no_ocg.md"
