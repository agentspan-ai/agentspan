plugins {
    id 'java'
    id 'application'
}

group = 'ai.agentspan'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':')
    // @Tool / @P annotations from LangChain4j are RUNTIME-retained; if the
    // dependency is only on the compile classpath, the JVM silently drops them
    // at class-load time and reflection-based tool extraction returns empty.
    // Keep this on both classpaths. Used by examples in the langchain/, openai/,
    // and adk/ subpackages (the bridges accept @dev.langchain4j.agent.tool.Tool or the
    // Agentspan-native @ai.agentspan.annotations.Tool annotation interchangeably).
    compileOnly 'dev.langchain4j:langchain4j:1.0.0'
    runtimeOnly 'dev.langchain4j:langchain4j:1.0.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.13'
}

compileJava.options.compilerArgs << '-parameters'

// Allow running individual examples via:
//   ./gradlew :examples:run -PmainClass=ai.agentspan.examples.openai.Example01BasicAgent
//   ./gradlew :examples:run -PmainClass=ai.agentspan.examples.adk.Example00HelloWorld
//   ./gradlew :examples:run -PmainClass=ai.agentspan.examples.langchain.Example09MathCalculator
application {
    mainClass = project.findProperty('mainClass') ?: 'ai.agentspan.examples.Example01BasicAgent'
}
