name: Publish C# SDK to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/csharp

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Pack
        run: |
          for proj in \
            src/Conductor.AI/Conductor.AI.csproj \
            src/Conductor.AI.OpenAI/Conductor.AI.OpenAI.csproj \
            src/Conductor.AI.SemanticKernel/Conductor.AI.SemanticKernel.csproj \
            src/Conductor.AI.GoogleADK/Conductor.AI.GoogleADK.csproj; do
            dotnet pack "$proj" \
              --configuration Release \
              -p:Version=${{ steps.version.outputs.version }} \
              --output ./nupkg
          done

      - name: Publish to NuGet
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json
